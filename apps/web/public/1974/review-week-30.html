<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Week 30 Review</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }

      .stack {
        width: 100vw;
        height: 100vh;
        overflow-y: auto;
        overflow-x: hidden;
        scroll-snap-type: y mandatory;
        scroll-behavior: smooth;
        -webkit-overflow-scrolling: touch;
      }

      .slide {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        scroll-snap-align: start;
        scroll-snap-stop: always;
        background: #000;
      }

      .slide img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        user-select: none;
        -webkit-user-drag: none;
        pointer-events: none;
      }

      .stack::-webkit-scrollbar { display: none; }
    </style>
  </head>
  <body>
    <main id="stack" class="stack" aria-label="Week 30 artwork review"></main>
    <script>
      const container = document.getElementById('stack')
      for (let rank = 1; rank <= 40; rank += 1) {
        const label = String(rank).padStart(2, '0')
        const slide = document.createElement('section')
        slide.className = 'slide'

        const image = document.createElement('img')
        image.src = '../cards/1974/week-30/week-30-rank-' + label + '.png'
        image.alt = 'Week 30 rank ' + label + ' card'
        image.decoding = 'async'
        image.loading = rank <= 2 ? 'eager' : 'lazy'

        slide.appendChild(image)
        container.appendChild(slide)
      }
    </script>
  </body>
</html>
