<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>RetroVerse 1974 Artwork Review</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }

      body {
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }

      .gallery {
        display: flex;
        flex-direction: row;
        width: 100vw;
        height: 100vh;
        overflow-x: auto;
        overflow-y: hidden;
        scroll-snap-type: x mandatory;
        scroll-behavior: smooth;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior-x: contain;
        overscroll-behavior-y: none;
      }

      .slide {
        flex: 0 0 100vw;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        scroll-snap-align: center;
        scroll-snap-stop: always;
        background: #000;
      }

      .slide img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
        user-select: none;
        -webkit-user-drag: none;
        pointer-events: none;
      }

      .gallery::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <main id="gallery" class="gallery" aria-label="1974 card review gallery"></main>

    <script>
      const TOTAL_IMAGES = 52
      const gallery = document.getElementById('gallery')

      for (let week = 1; week <= TOTAL_IMAGES; week += 1) {
        const weekLabel = String(week).padStart(2, '0')

        const slide = document.createElement('section')
        slide.className = 'slide'
        slide.setAttribute('aria-label', `Week ${weekLabel}`)

        const image = document.createElement('img')
        image.src = `../cards/1974/week-${weekLabel}.png`
        image.alt = `Week ${weekLabel} artwork`
        image.decoding = 'async'
        image.loading = week <= 2 ? 'eager' : 'lazy'

        slide.appendChild(image)
        gallery.appendChild(slide)
      }
    </script>
  </body>
</html>
