<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RetroVerse</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #fdf8e8 0%, #efe7d2 55%, #e4dac3 100%);
        color: #2d261b;
      }

      main {
        width: min(680px, 92vw);
        padding: 56px 32px;
        border: 1px solid rgba(45, 38, 27, 0.14);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.86);
        box-shadow: 0 30px 70px rgba(45, 38, 27, 0.12);
        text-align: center;
      }

      h1 {
        margin: 0 0 28px;
        font-size: clamp(2rem, 6vw, 3.15rem);
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .actions {
        display: grid;
        gap: 18px;
      }

      .entry-btn {
        display: block;
        width: 100%;
        padding: 20px 24px;
        border-radius: 14px;
        border: 2px solid #2d261b;
        background: #2d261b;
        color: #fffdf5;
        text-decoration: none;
        font-size: clamp(1.15rem, 3.2vw, 1.5rem);
        font-weight: 700;
        letter-spacing: 0.02em;
        transition: transform 120ms ease, box-shadow 120ms ease, background-color 120ms ease;
      }

      .entry-btn:hover,
      .entry-btn:focus-visible {
        transform: translateY(-1px);
        background: #463825;
        box-shadow: 0 12px 24px rgba(45, 38, 27, 0.2);
      }

      .entry-btn:focus-visible {
        outline: 3px solid rgba(45, 38, 27, 0.2);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>RetroVerse</h1>
      <div class="actions">
        <a class="entry-btn" href="/charts">Charts App</a>
        <a class="entry-btn" href="/video-library">Video Library</a>
      </div>
    </main>
  </body>
</html>
