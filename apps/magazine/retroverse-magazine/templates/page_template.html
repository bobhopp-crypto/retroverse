<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>[[DOC_TITLE]]</title>
    <link rel="stylesheet" href="[[CSS_HREF]]" />
  </head>
  <body>
    <div class="preview-shell">
      <article class="mag-page">
        <header class="masthead">
          <p class="masthead-kicker">[[MASTHEAD_KICKER]]</p>
          <h1 class="brand-name">[[MASTHEAD_TITLE]]</h1>
          <p class="masthead-subtitle">[[MASTHEAD_SUBTITLE]]</p>
        </header>

        <section class="page-meta">
          <p class="section-label">[[SECTION_LABEL]]</p>
          <h2 class="page-title">[[PAGE_TITLE]]</h2>
          <p class="subtitle">[[SUBTITLE]]</p>
          <p class="byline">[[BYLINE]]</p>
        </section>

        <section class="content-grid">
          <div class="main-column">
            [[MAIN_CONTENT]]
          </div>
          <aside class="side-column">
            [[IMAGE_BOX]]
            [[SIDEBAR_BOX]]
            [[DATA_BOX]]
          </aside>
        </section>

        <footer class="page-footer">
          <div class="pager">Page [[PAGE_NUMBER]]</div>
          <nav class="page-nav">[[NAV_LINKS]]</nav>
        </footer>
      </article>
    </div>
  </body>
</html>
