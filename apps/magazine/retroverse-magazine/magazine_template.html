<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RetroVerse Magazine {{YEAR}}</title>
    <style>
      :root {
        --paper: #f3e5bf;
        --paper-dark: #e7d5a6;
        --ink: #2f2619;
        --accent-red: #a42020;
        --accent-blue: #214d6f;
        --accent-gold: #b78318;
        --frame: #6d4e21;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: clamp(8px, 2vw, 24px);
        background: radial-gradient(circle at top, #fff4cf 0%, var(--paper) 55%, var(--paper-dark) 100%);
        color: var(--ink);
        font-family: "Bookman Old Style", "Palatino Linotype", "Times New Roman", serif;
      }

      .page {
        width: min(8.5in, 100%);
        min-height: 11in;
        margin: 0 auto 24px;
        padding: 0.6in;
        border: 4px solid var(--frame);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.22);
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.2), transparent 45%),
          linear-gradient(0deg, rgba(0, 0, 0, 0.03), transparent 38%),
          var(--paper);
        position: relative;
        overflow: hidden;
      }

      .page::before {
        content: "";
        position: absolute;
        inset: 16px;
        border: 1px solid rgba(109, 78, 33, 0.35);
        pointer-events: none;
      }

      .masthead,
      h1,
      h2,
      h3 {
        font-family: "Impact", "Arial Black", "Franklin Gothic Heavy", sans-serif;
        letter-spacing: 0.02em;
      }

      h2,
      h3 {
        text-transform: uppercase;
      }

      .masthead {
        font-size: 76px;
        line-height: 0.9;
        margin: 0;
        color: var(--accent-red);
        text-shadow: 2px 2px 0 #f9d79c, 4px 4px 0 rgba(0, 0, 0, 0.2);
      }

      .brand-name {
        text-transform: none;
        letter-spacing: 0.04em;
      }

      .issue-line {
        margin-top: 10px;
        font-size: 15px;
        font-weight: 700;
        text-transform: none;
        letter-spacing: 0.08em;
      }

      .subhead {
        font-family: "Arial Black", "Impact", sans-serif;
        font-size: 33px;
        line-height: 1.1;
        margin: 20px 0 12px;
        color: var(--accent-blue);
      }

      .deck {
        font-size: 22px;
        margin: 0 0 16px;
      }

      .cover-grid {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 16px;
        margin-top: 24px;
      }

      .cover-callout {
        border: 3px solid var(--ink);
        padding: 12px;
        background: rgba(255, 255, 255, 0.34);
      }

      .cover-callout h3 {
        margin: 0 0 8px;
        font-size: 22px;
      }

      .cover-callout ul {
        margin: 0;
        padding-left: 18px;
        font-size: 16px;
        line-height: 1.4;
      }

      .cover-burst {
        align-self: end;
        justify-self: end;
        width: 160px;
        height: 160px;
        border-radius: 50%;
        border: 4px dashed var(--accent-red);
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-family: "Arial Black", sans-serif;
        font-size: 17px;
        line-height: 1.2;
        background: #ffefb6;
        transform: rotate(-10deg);
      }

      .section-kicker {
        font-weight: 800;
        text-transform: uppercase;
        font-size: 14px;
        letter-spacing: 0.1em;
        color: var(--accent-red);
      }

      .two-column {
        column-count: 2;
        column-gap: 28px;
      }

      .two-column p {
        margin-top: 0;
      }

      .feature-card {
        margin-bottom: 14px;
      }

      .feature-headline {
        color: var(--accent-red);
        margin: 6px 0 8px;
        font-size: 36px;
        line-height: 1;
      }

      .songline {
        margin: 0 0 14px;
        font-size: 18px;
        font-weight: 700;
      }

      .image-box {
        border: 4px solid var(--ink);
        background: #faf0d0;
        padding: 10px;
      }

      .image-box img {
        display: block;
        width: 100%;
        max-height: 6.1in;
        object-fit: contain;
      }

      .caption-box {
        margin-top: 8px;
        padding: 8px 10px;
        border-left: 6px solid var(--accent-gold);
        border-right: 2px solid rgba(47, 38, 25, 0.55);
        border-top: 2px solid rgba(47, 38, 25, 0.55);
        border-bottom: 2px solid rgba(47, 38, 25, 0.55);
        font-size: 15px;
        font-style: italic;
        background: rgba(255, 255, 255, 0.48);
      }

      .pull-quote {
        margin: 16px 0;
        padding: 12px;
        border-top: 3px solid var(--accent-red);
        border-bottom: 3px solid var(--accent-red);
        font-family: "Arial Black", "Impact", sans-serif;
        font-size: 24px;
        line-height: 1.2;
        color: var(--accent-blue);
      }

      .mini-rule {
        height: 4px;
        border: 0;
        background: linear-gradient(to right, var(--accent-red), var(--accent-gold), var(--accent-red));
        margin: 16px 0;
      }

      .letters-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .letter-item {
        border: 2px solid rgba(47, 38, 25, 0.6);
        padding: 10px;
        background: rgba(255, 255, 255, 0.42);
      }

      .ad-box {
        border: 6px double var(--ink);
        padding: 20px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.38), rgba(255, 255, 255, 0.15));
      }

      .ad-title {
        font-size: 50px;
        line-height: 0.95;
        margin: 0 0 10px;
        color: var(--accent-red);
      }

      .ad-sub {
        font-size: 24px;
        margin: 0 0 10px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }

      th,
      td {
        border: 1px solid rgba(47, 38, 25, 0.55);
        padding: 6px;
        text-align: left;
      }

      th {
        font-family: "Arial Black", "Impact", sans-serif;
        letter-spacing: 0.02em;
        background: rgba(167, 32, 32, 0.14);
      }

      .footer-note {
        position: absolute;
        right: 20px;
        bottom: 14px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      @media (max-width: 900px) {
        .page {
          min-height: auto;
          margin: 0 auto 12px;
          padding: clamp(12px, 3.5vw, 24px);
        }

        .page::before {
          inset: 8px;
        }

        .masthead {
          font-size: clamp(44px, 11vw, 76px);
        }

        .subhead {
          font-size: clamp(24px, 6vw, 33px);
        }

        .deck {
          font-size: clamp(16px, 4.2vw, 22px);
        }

        .cover-grid {
          grid-template-columns: 1fr;
        }

        .cover-burst {
          justify-self: center;
          width: 120px;
          height: 120px;
          font-size: 13px;
        }

        .two-column {
          column-count: 1;
        }

        .feature-headline {
          font-size: clamp(26px, 7vw, 36px);
        }

        .songline {
          font-size: 16px;
        }

        .pull-quote {
          font-size: clamp(18px, 5vw, 24px);
        }

        .letters-grid {
          grid-template-columns: 1fr;
        }

        .image-box img {
          max-height: 60vh;
        }

        .footer-note {
          position: static;
          margin-top: 8px;
        }
      }

      @page {
        size: letter;
        margin: 0.45in;
      }

      @media print {
        body {
          margin: 0;
          padding: 0;
          background: white;
        }

        .page {
          margin: 0;
          box-shadow: none;
          page-break-after: always;
          break-after: page;
        }

        .page:last-child {
          page-break-after: auto;
          break-after: auto;
        }
      }
    </style>
  </head>
  <body>
    {{COVER_PAGE}}
    {{EDITOR_PAGE}}
    {{FEATURE_PAGES}}
    {{POP_CULTURE_PAGE}}
    {{FAKE_AD_PAGE}}
    {{LETTERS_PAGE}}
    {{TOP40_PAGE}}
  </body>
</html>
