[build]
  base = "."
  command = "npm run build"
  publish = "apps/web/dist"

[functions]
  directory = "apps/web/netlify/functions"
  node_bundler = "esbuild"
  included_files = ["data/derived/culture/processed/billboard_hot100.csv", "data/raw/charts/billboard-hot-100.db"]

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/cards/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/billboard/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/charts"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/charts/"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/magazine/:year"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/magazine/:year/"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
