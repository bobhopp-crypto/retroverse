[build]
  base = "."
  command = "npm run build"
  publish = "apps/web/dist"

[functions]
  directory = "apps/web/netlify/functions"
  node_bundler = "esbuild"
  included_files = ["data/derived/culture/processed/billboard_hot100.csv", "data/raw/charts/billboard-hot-100.db"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/billboard/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/charts"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/charts/"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/magazine/:year"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/magazine/:year/"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
