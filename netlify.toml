[build]
  base = "."
  command = "npm run build"
  publish = "apps/web/dist"

[functions]
  directory = "apps/web/netlify/functions"
  node_bundler = "esbuild"
  included_files = ["./data/derived/culture/processed/billboard_hot100.csv", "./data/raw/charts/billboard-hot-100.db"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/billboard/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/charts"
  to = "/charts/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/charts/"
  to = "/charts/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/video-library"
  to = "/video-library/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/video-library/*"
  to = "/video-library/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/videolibrary"
  to = "/video-library"
  status = 301
  force = true
